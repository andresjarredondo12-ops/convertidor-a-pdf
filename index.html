<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Convertidor Masivo a PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #0056b3; }
        #status { margin-top: 15px; color: #333; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Convertidor HTML a PDF Masivo</h2>
    <p>Selecciona tus archivos .html (puedes seleccionar muchos a la vez manteniendo presionado Shift o Ctrl):</p>
    
    <input type="file" id="fileInput" multiple accept=".html">
    <br><br>
    <button onclick="procesarArchivos()">Convertir y Descargar Todo</button>
    
    <div id="status"></div>
</div>

<div id="temp-content" style="display:none;"></div>

<script>
async function procesarArchivos() {
    const input = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const tempContainer = document.getElementById('temp-content');
    const totalFiles = input.files.length;

    if (totalFiles === 0) {
        alert("Por favor, selecciona al menos un archivo.");
        return;
    }

    const opciones = {
        margin:       10,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    let contador = 0;

    for (let file of input.files) {
        contador++;
        status.innerText = `Procesando (${contador} de ${totalFiles}): ${file.name}`;

        try {
            const text = await file.text();
            tempContainer.innerHTML = text;

            // Actualizamos el nombre del PDF basado en el HTML original
            opciones.filename = file.name.replace(/\.html?$/i, '.pdf');

            // Generamos y descargamos el PDF
            await html2pdf().set(opciones).from(tempContainer).save();

            // Pequeña pausa de 300ms para evitar que el navegador sature las descargas
            await new Promise(resolve => setTimeout(resolve, 300));

        } catch (error) {
            console.error(`Error procesando ${file.name}:`, error);
        }
    }

    status.innerText = `¡Proceso completado! Se han procesado ${totalFiles} archivos.`;
    tempContainer.innerHTML = ""; // Limpiamos el contenedor temporal
}
</script>

</body>
</html>
